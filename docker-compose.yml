# =============================================================================
# SmartCampus Unified Docker Compose
# Bao gồm toàn bộ 3 phân hệ:
#   1. Edge Gateway & TimescaleDB & Mosquitto MQTT (cấu hình trong ./edge)
#   2. AI Service & pgvector & Ollama LLM (cấu hình trong ./AI + Backend)
#   3. Digital Twin 3D Frontend (cấu hình trong ./frontend)
# =============================================================================

include:
  - path: ./edge/docker-compose.yml
    env_file: ./edge/.env
  - path: ./AI + Backend/docker-compose.yml
    env_file: ./AI + Backend/.env
  - path: ./frontend/docker-compose.yml

